<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Royal Game of Ur</title>
<style>
  body {
    background: #222;
    color: #eee;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(8, 50px);
    grid-template-rows: repeat(3, 50px);
    gap: 4px;
    margin-bottom: 10px;
  }
  .cell {
    width: 50px;
    height: 50px;
    border: 1px solid #555;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    position: relative;
  }
  .index {
    position: absolute;
    bottom: 2px;
    right: 3px;
    font-size: 10px;
    color: #888;
  }
  .rosette {
    border-color: gold;
  }
  .p1 { color: #4cf; }
  .p2 { color: #f66; }
  #controls {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    align-items: center;
  }
  button {
    padding: 6px 12px;
  }
</style>
</head>
<body>

<h2>Royal Game of Ur</h2>

<div id="board"></div>

<div id="controls">
  <button id="rollBtn">Roll Dice</button>
  <span id="rollResult">Roll: -</span>
  <span id="turnInfo"></span>
</div>

<div id="status"></div>

<script src="ur.js"></script>

</body>
</html>
